buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.1.20')}")
        classpath("com.android.tools.build:gradle:8.13.0")
    }
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

android {
    // The closed engine AAR owns the "com.bgeo" namespace (R class, resources);
    // the bridge keeps its Kotlin sources in package com.bgeo but namespaces
    // its own R separately to avoid a duplicate-namespace clash.
    namespace "com.bgeo.rn"

    buildToolsVersion safeExtGet("buildToolsVersion", "36.0.0")
    compileSdkVersion safeExtGet("compileSdkVersion", 36)

    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm.
        url("$rootDir/../node_modules/react-native/android")
    }
    maven {
        // The closed engine AAR ships inside this npm package.
        url("$projectDir/libs")
    }
    google()
    mavenCentral()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+" // From node_modules

    // Closed-source engine (FusedLocation, motion machine, HTTP queue). Its POM
    // pulls play-services-location + okhttp transitively.
    api "dev.bgeo:bgeo-android:0.13.3"
}
